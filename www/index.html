<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0C4A43" />
<title>BolSetu</title>
<style>
@font-face{font-family:"Tiro";src:url(fonts/tiro.woff2) format("woff2");font-display:swap}
@font-face{font-family:"TiroHi";src:url(fonts/tiro-hi.woff2) format("woff2");font-display:swap}
@font-face{font-family:"TiroLat";src:url(fonts/tiro-lat.woff2) format("woff2");font-display:swap}
@font-face{font-family:"AnekLat";font-weight:500;src:url(fonts/anek-lat-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:"AnekLat";font-weight:700;src:url(fonts/anek-lat-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:"AnekLat";font-weight:800;src:url(fonts/anek-lat-800.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Anek";font-weight:500;src:url(fonts/anek-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Anek";font-weight:700;src:url(fonts/anek-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Anek";font-weight:800;src:url(fonts/anek-800.woff2) format("woff2");font-display:swap}
:root{
  /* BolSetu design system: deep peacock teal + marigold, soft paper surfaces */
  --chuna:#F3F5F1; --paper:#F3F5F1; --white:#fff; --surface:#fff;
  --mor:#0C4A43; --mor-d:#08332F; --mor-2:#14695F; --mor-l:#BFE0D7; --mor-t:#E5F2EE;
  --ink:#0E2A26; --ink2:#566B65; --ink3:#8A9B95; --line:#E2E8E3; --line2:#EEF2EE;
  --zendu:#F6A609; --zendu-d:#D98E00; --zendu-t:#FFF2D4;
  --kunku:#D2243A; --kunku-d:#A3172A; --kunku-t:#FDE7E9;
  --paan:#22985A; --paan-d:#167443; --paan-t:#E2F5EA;
  --family:#D2243A; --family-t:#FDE4E6;
  --daily:#1E73B3;  --daily-t:#E1EEF9;
  --health:#7A3A8C; --health-t:#F1E6F5;
  --feel:#D98E00;   --feel-t:#FFF1D2;
  --outing:#22985A; --outing-t:#E2F4E3;
  --word:#4C6862;   --word-t:#E8EEEA;
  --yes:var(--paan); --no:var(--kunku); --brand:var(--mor); --brand-t:#E5F2EE; --gold:var(--zendu);
  --sh1:0 1px 2px rgba(14,42,38,.06),0 2px 6px rgba(14,42,38,.04);
  --sh2:0 1px 2px rgba(14,42,38,.05),0 10px 26px -12px rgba(14,42,38,.28);
  --sh3:0 2px 6px rgba(14,42,38,.08),0 24px 48px -20px rgba(14,42,38,.38);
  --hero:radial-gradient(120% 90% at 100% 0%,#1D7E71 0%,rgba(29,126,113,0) 55%),radial-gradient(90% 80% at 0% 100%,#0A3D38 0%,rgba(10,61,56,0) 60%),linear-gradient(160deg,#0F5A51,#0A3F39);
  --disp:"Tiro","TiroLat","Noto Serif Devanagari",serif;
  --ui:"Anek","AnekLat","Noto Sans Devanagari","Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0}
input,select{user-select:text;-webkit-user-select:text;font:500 1rem var(--ui)}
html,body{height:100%}
body{background:var(--mor-d);color:var(--ink);font-family:var(--ui);font-weight:500;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--ui);color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;background:var(--chuna)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fx{display:inline-block;object-fit:contain;flex:none;vertical-align:middle}

/* header */
.top{background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px}
.brandmark{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#FFC24A,#F29E00);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);flex:none}
.logo svg{width:26px;height:26px;fill:none;stroke:#3A2500;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.title{font:400 1.55rem/1 var(--disp);min-width:0}
.title small{display:block;font:500 .8rem/1.25 var(--ui);color:var(--mor-l);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos{height:48px;padding:0 18px;border-radius:24px;border:none;background:linear-gradient(180deg,#E8384D,#C21A2F);color:#fff;font-weight:800;font-size:1.05rem;
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 18px -8px rgba(210,36,58,.8),inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.sos::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25);animation:sosb 1.6s infinite}
@keyframes sosb{50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
.sos:active,.btn:active,.card:active,.yn button:active,.tap:active,.replay:active,.opt:active,.tile:active,.step:active,.xgrid button:active,.item:active,.rate button:active{transform:scale(.97)}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cap{background:var(--hero);color:#fff;padding:6px 16px 20px;border-radius:0 0 30px 30px;flex:none}
.pad{padding:6px 16px 28px}

/* the slate: what he is saying */
.slate{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;min-height:82px;backdrop-filter:blur(6px)}
.say-text{flex:1;min-width:0}
.say-mr{font:400 1.85rem/1.2 var(--disp);color:#FFF4D6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.say-sub{font-size:.82rem;color:var(--mor-l);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{display:flex;align-items:center;gap:3px;height:30px;width:26px;flex:none}
.wave i{flex:1;background:var(--zendu);border-radius:3px;height:6px;opacity:.45}
.talking .wave i{opacity:1;animation:bar .7s ease-in-out infinite}
.talking .wave i:nth-child(2){animation-delay:.12s}.talking .wave i:nth-child(3){animation-delay:.24s}.talking .wave i:nth-child(4){animation-delay:.36s}
@keyframes bar{50%{height:28px}}
.replay{width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(180deg,#FFC24A,#F29E00);color:#3A2500;flex:none;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(242,158,0,.9)}
.replay svg{width:26px;height:26px}

/* board */
.board{flex:1;min-height:0;display:flex}
.tabs{width:84px;flex:none;overflow-y:auto;padding:14px 0 14px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{width:68px;flex:none;border:none;background:transparent;border-radius:20px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;font-weight:800;color:var(--ink2);transition:background .2s,color .2s}
.tab .e{width:38px;height:38px;display:grid;place-items:center;border-radius:14px;transition:transform .2s var(--ease)}
.tab .e .fx{width:32px;height:32px}
.tab.active{background:var(--white);color:var(--c);box-shadow:var(--sh2)}
.tab.active .e{transform:scale(1.08)}
.board .scroll{padding:14px 14px 16px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{--c:var(--word);--t:var(--word-t);background:var(--white);border-radius:24px;padding:12px 8px 14px;min-height:156px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;transition:transform .12s var(--ease),box-shadow .2s;box-shadow:var(--sh2)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c);opacity:.9}
.family{--c:var(--family);--t:var(--family-t)}.daily{--c:var(--daily);--t:var(--daily-t)}.health{--c:var(--health);--t:var(--health-t)}
.feel{--c:var(--feel);--t:var(--feel-t)}.outing{--c:var(--outing);--t:var(--outing-t)}.word{--c:var(--word);--t:var(--word-t)}
.card.speaking{box-shadow:0 0 0 4px var(--zendu),var(--sh3)}
.pic{width:88px;height:88px;border-radius:26px;display:grid;place-items:center;font-size:3.4rem;line-height:1;overflow:hidden;flex:none;
  background:radial-gradient(circle at 50% 38%,#fff 0%,var(--t,var(--word-t)) 72%)}
.pic .fx{width:76%;height:76%;filter:drop-shadow(0 6px 8px rgba(14,42,38,.18))}
.pic.init{background:linear-gradient(150deg,var(--c,var(--mor)),color-mix(in srgb,var(--c,var(--mor)) 70%,#000));color:#fff;font:400 2.5rem/1 var(--disp);border-radius:50%;width:80px;height:80px;margin:4px 0;box-shadow:var(--sh1)}
.pic img.ph{width:100%;height:100%;object-fit:cover}
.pic.round{border-radius:50%}
.pic.xl{width:228px;height:228px;font-size:7.5rem;border-radius:52px;box-shadow:var(--sh3);position:relative;
  background:radial-gradient(circle at 50% 42%,#fff 0%,#fff 30%,var(--t,var(--word-t)) 78%)}
.pic.xl::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 -14px 30px -18px var(--c,var(--word));pointer-events:none}
.pic.xl .fx{width:64%;height:64%;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 16px 14px rgba(14,42,38,.22))}
.pic.xl.round{border-radius:50%}
@keyframes floaty{50%{transform:translateY(-7px) rotate(-1.5deg)}}
.pic.sm{width:72px;height:72px;font-size:2.4rem;border-radius:22px;background:radial-gradient(circle at 50% 38%,#fff 0%,var(--t,var(--zendu-t)) 72%);box-shadow:var(--sh1)}
.name{font-size:1.28rem;font-weight:800;line-height:1.15;color:var(--ink)}
.en{font-size:.74rem;color:var(--ink3);margin-top:2px;font-weight:600}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px;background:var(--white);box-shadow:0 -1px 0 var(--line);flex:none}
.yn button{height:70px;border:none;border-radius:24px;color:#fff;font-weight:800;font-size:1.65rem;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .12s var(--ease)}
.yn .y{background:linear-gradient(180deg,#2DB16B,#1C8A4F);box-shadow:0 10px 22px -10px rgba(34,152,90,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.yn .n{background:linear-gradient(180deg,#E8384D,#C21A2F);box-shadow:0 10px 22px -10px rgba(210,36,58,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.yn svg{width:34px;height:34px;padding:6px;border-radius:50%;background:rgba(255,255,255,.2);stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* bottom navigation */
.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--white);box-shadow:0 -1px 0 var(--line),0 -10px 30px -20px rgba(14,42,38,.3);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));flex:none;position:relative;z-index:2}
.nav button{border:none;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.85rem;color:var(--ink3);transition:color .2s}
.nav .ni{width:64px;height:34px;border-radius:17px;display:grid;place-items:center;transition:background .25s var(--ease)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--mor)}
.nav .on .ni{background:var(--mor-t)}
.yn .yni{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
.st-foot{display:flex;gap:10px}.st-foot .btn.big{flex:1}
.btn.sq{width:64px;min-height:64px;padding:0;border-radius:22px;flex:none}.btn.sq svg{width:26px;height:26px}
.card.family .pic.round,.card.family .pic.init{width:108px;height:108px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--family-t)}
.card.family .pic.init{font-size:3rem}
.pic.full{background:none}.pic.full img.ph{border-radius:inherit}
/* photo chooser */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(8,30,27,.55);display:flex;align-items:flex-end;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet-in{background:var(--white);width:100%;border-radius:28px 28px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h4{font:400 1.4rem/1.2 var(--disp);text-align:center;margin-bottom:16px;color:var(--ink)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .two button{border:none;border-radius:24px;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;background:var(--mor-t);color:var(--mor)}
.sheet .two button:last-child{background:var(--zendu-t);color:#7A5200}
.sheet .two .fx{width:60px;height:60px}
.sheet .cancel{width:100%;margin-top:12px}
/* family in setup */
.fam{display:flex;flex-direction:column;gap:10px}
.fp{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:10px 12px}
.fp>div{flex:1;min-width:0}.fp b{display:block;font-size:1.15rem}.fp small{color:var(--mor-l)}
.fav{position:relative;width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);padding:0;flex:none;overflow:visible;display:grid;place-items:center;color:#fff}
.fav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fav .ini{font:400 2rem/1 var(--disp)}
.fav .cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--zendu);color:#2E1D00;display:grid;place-items:center;border:2px solid var(--mor)}
.fav .cam svg{width:16px;height:16px}
.fav.big{width:96px;height:96px;border-style:dashed}
.fav.big .lbl{font-size:.8rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.fadd{display:flex;gap:12px;align-items:center;margin-top:12px}
.fadd .ff{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.su-close{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.setup{position:fixed}

/* buttons */
.btn{border:1.5px solid var(--line);border-radius:18px;min-height:58px;padding:0 18px;font-weight:800;font-size:1.06rem;background:var(--white);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh1);transition:transform .12s var(--ease),background .2s;text-align:center;line-height:1.2}
.btn .bi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--mor-t);color:var(--mor);flex:none}
.btn .bi svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(180deg,#FFBE3D,#F39F00);border-color:transparent;color:#2E1D00;box-shadow:0 10px 22px -10px rgba(243,159,0,.95),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary .bi{background:rgba(255,255,255,.35);color:#2E1D00}
.btn.dark{background:var(--mor);border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(12,74,67,.9)}
.btn.big{width:100%;min-height:64px;font-size:1.25rem;border-radius:22px}
.btn.recording,.ib.recording{background:linear-gradient(180deg,#E8384D,#C21A2F);border-color:transparent;color:#fff;animation:pulse 1.2s infinite}
.btn.recording .bi{background:rgba(255,255,255,.25);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(210,36,58,.18)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.row .btn{flex:1;min-width:140px}
.muted{color:var(--ink2);font-size:.92rem;line-height:1.55}
.h2{font:400 1.4rem/1.2 var(--disp);margin:26px 0 12px;color:var(--ink)}

/* hero (practice + progress) */
.hero{background:var(--hero);color:#fff;padding:8px 18px 22px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.04);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero-top>div:first-child{flex:1;min-width:0}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFD67A}
.hello{font:400 2.05rem/1.15 var(--disp);margin-top:4px}
.streak{color:var(--mor-l);margin-top:6px;display:flex;align-items:center;gap:6px;font-size:.95rem}
.streak .fx{width:22px;height:22px}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.14)}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset .8s var(--ease)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font:800 1.6rem/1 var(--ui)}.ring small{display:block;font-size:.7rem;color:var(--mor-l);margin-top:3px}
.lv{display:flex;gap:6px;margin-top:18px;padding:5px;background:rgba(0,0,0,.18);border-radius:18px;position:relative;z-index:1}
.lv button{flex:1;height:42px;border-radius:14px;border:none;background:none;color:rgba(255,255,255,.75);font-weight:800;font-size:1.15rem;transition:all .2s}
.lv .on{background:#FFF4D6;color:var(--mor-d);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.lvn{margin-top:12px;color:var(--mor-l);font-size:.9rem;line-height:1.45;position:relative;z-index:1}.lvn b{display:block;color:#fff;font-size:1.1rem}
.beads{display:flex;gap:5px;margin:16px 0;position:relative;z-index:1}
.beads i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.16)}
.beads i.on{background:linear-gradient(90deg,#FFD067,#F6A609)}
.hero .btn{position:relative;z-index:1}
.hero .btn:not(.primary){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;box-shadow:none}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 12px}
.sec-h h2{font:400 1.4rem/1.2 var(--disp)}
.sec-h span{font-size:.85rem;font-weight:800;color:var(--ink3)}

/* today's plan */
.mala{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;width:100%;background:var(--white);border:none;border-radius:22px;padding:12px 14px 12px 12px;text-align:left;box-shadow:var(--sh2);transition:transform .12s var(--ease)}
.stile{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fff,var(--mor-t) 75%);flex:none;position:relative}
.stile .fx{width:38px;height:38px;filter:drop-shadow(0 4px 5px rgba(14,42,38,.18))}
.stile .no{position:absolute;left:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--mor);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--white)}
.step .tx{flex:1;min-width:0}
.step b{display:block;font-size:1.18rem;font-weight:800;line-height:1.2}
.step small{font-size:.8rem;color:var(--ink3);display:block;margin-top:2px}
.step .min{font-weight:800;color:var(--ink2);font-size:.78rem;background:var(--line2);padding:5px 9px;border-radius:10px;white-space:nowrap}
.step .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.step .chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;opacity:0}
.done .step{background:linear-gradient(90deg,var(--paan-t),#fff 70%)}
.done .chk{background:var(--paan);border-color:var(--paan)}.done .chk svg{opacity:1}
.done .stile .no{background:var(--paan)}
.mala li.next .step{box-shadow:0 0 0 2.5px var(--zendu),var(--sh2)}

.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    </div>

      <nav class="tabs" id="tabs"></nav>
      <main class="scroll"><div class="grid" id="grid"></div></main>
    </div>
    <div class="yn">

  <!-- PRACTICE -->
  <section class="view" id="v-practice" hidden><main class="scroll" id="practice"></main></section>

  <!-- PROGRESS -->
  <section class="view" id="v-more" hidden><main class="scroll" id="more"></main></section>

  <nav class="nav" id="nav">

  </nav>
</div>

function buildData(lang,voice,who){
  who=who||{};const P=PACKS[lang]||PACKS.en,fi=voice==='f';
  const str=s=>{s=s.replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,b)=>fi?b:a).replace(/\{(\w+)\}/g,(m,k)=>who[k]||m);return s.indexOf('{')>=0?null:s};
  const res=v=>{
    if(typeof v==='string')return str(v);
    if(Array.isArray(v)){const o=v.map(res);if(v.length&&v[0]&&typeof v[0]==='object'&&!Array.isArray(v[0]))return o.filter(x=>x!==null);return o.some(x=>x===null)?null:o}
    if(v&&typeof v==='object'){const o={};for(const k in v){if(k==='ui'){o[k]=v[k];continue}const r=res(v[k]);if(r===null)return null;o[k]=r}return o}
    return v};
  const D=res(P);
  D.bs.forEach(x=>x.w=x.s.split(' '));
  return D;
}
/* Every phrase the app can speak in one language. Used by the app AND by the GitHub build to create audio/<lang>-<voice>/<id>.mp3 */
function inWord(D,w){return D.deva||w===w.toUpperCase()?w:w.toLowerCase()}
function allAudio(D,custom){
  const L=[],add=(id,text,g)=>L.push({id:id,text:text,g:g}),f=(s,a)=>s.replace('[0]',a);
  D.quick.forEach(q=>add(q.id,q.speak,'1'));
  D.cards.concat(custom||[]).forEach(c=>{if(c.speak)add(c.id,c.speak,'1')});
  D.cards.forEach(c=>{if(c.cue){const w=c.w||c.mr;add('w_'+c.id,w,'2');add('c_'+c.id,c.cue,'3');add('q_'+c.id,f(D.tpl.isThis,inWord(D,w)),'4')}});
  D.vowels.concat(D.syll,D.auto,D.melodic,D.scripts,D.moves,D.tw,D.open).forEach(x=>add(x.id,x.speak,'5'));
  D.cloze.forEach(x=>{const c=D.cards.find(k=>k.id===x.ans),w=c.w||c.mr;add(x.id,x.mr.split('___')[0].trim(),'6');add(x.id+'_f',x.mr.replace('___',inWord(D,w)),'6')});
  D.bs.forEach(x=>add(x.id,x.s,'7'));
  D.conv.forEach(s=>s.turns.forEach(t=>{add(t.id,t.q,'8');t.a.forEach((a,j)=>add(t.id+'_a'+j,a,'8'))}));
  D.opp.forEach(o=>{add(o.id,f(D.tpl.oppQ,o.a),'9');add(o.id+'_a',o.b,'9')});
  D.nums.forEach((t,i)=>add('n_'+(i+1),t,'10'));D.days.forEach((t,i)=>add('d_'+i,t,'10'));
  D.months.forEach((t,i)=>add('mo_'+i,t,'10'));D.dayparts.forEach((t,i)=>add('dp_'+i,t,'10'));
  return L;
}

let AC=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,d,v,type){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;d=d||.4;
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function chime(){[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.4,.2),i*130))}
let dr=null;
function droneOn(){droneOff();try{const a=ac(),g=a.createGain(),t=a.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.2,t+.7);g.connect(a.destination);
  const os=[[136.1,1],[272.2,.6],[408.3,.3],[544.4,.14]].map(p=>{const o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.value=p[0];og.gain.value=p[1];o.connect(og);og.connect(g);o.start();return o});
  dr={g:g,os:os}}catch(e){}}
function droneOff(){if(!dr)return;const d=dr;dr=null;try{const t=ac().currentTime;d.g.gain.cancelScheduledValues(t);d.g.gain.setValueAtTime(d.g.gain.value,t);d.g.gain.linearRampToValueAtTime(0.0001,t+.5);d.os.forEach(o=>o.stop(t+.6))}catch(e){}}

/* Voice priority: 1) family-recorded voice  2) bundled audio/<id>.mp3 (built by GitHub)  3) phone Marathi TTS */
let cur=null,sayTok=0;const noClip={};
function stopAll(){sayTok++;if(cur){try{cur.pause()}catch(e){}cur=null}
  try{const T=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;T&&T.stop()}catch(e){}
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function playSrc(src,rate){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  try{const a=new Audio(src);cur=a;a.preload='auto';a.onended=()=>fin(true);a.onpause=()=>fin(true);a.onerror=()=>fin(false);
    a.onloadedmetadata=()=>{try{a.playbackRate=rate||1}catch(e){}};
    const p=a.play();if(p&&p.catch)p.catch(()=>fin(false))}catch(e){fin(false)}})}
async function say(id,text){
  stopAll();const tok=sayTok;
  const v=DB.mem['voice:'+id];
  if(v&&await playSrc(v,1))return;
  if(tok!==sayTok)return;
  if(!noClip[id]&&!/^[xp]\d/.test(String(id))){if(await playSrc('audio/'+S.lang+'-'+(S.voice==='f'?'f':'m')+'/'+id+'.mp3',S.slow?.88:1))return;noClip[id]=1}
  if(tok!==sayTok||!text)return;
  const rate=S.slow?.75:.95;
  const TTS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;
  if(TTS){for(const lang of DATA.tts){try{await TTS.speak({text:text,lang:lang,rate:rate,pitch:1,volume:1,category:'playback'});return}catch(e){}}}
  if('speechSynthesis' in window){await new Promise(res=>{try{
    const all=speechSynthesis.getVoices()||[];
    const vc=DATA.tts.map(l=>all.find(x=>String(x.lang).toLowerCase().indexOf(l.slice(0,2))===0)).find(Boolean);
    const u=new SpeechSynthesisUtterance(text);window.__u=u;
    if(vc){u.voice=vc;u.lang=vc.lang}else u.lang=DATA.tts[0];
    u.rate=rate;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,8000)}catch(e){res()}})}
}

/* recorder: tap to start, tap again to stop (auto-stops) */
let rec=null;
async function recToggle(btn,onDone,maxMs){
  if(rec){try{rec.stop()}catch(e){}return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[],r=rec=new MediaRecorder(stream,{audioBitsPerSecond:32000});
    const label=btn.innerHTML;let to=0;
    r.ondataavailable=x=>{if(x.data&&x.data.size)chunks.push(x.data)};
    r.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(rec===r)rec=null;clearTimeout(to);
      btn.classList.remove('recording');btn.innerHTML=label;
      if(!chunks.length)return;const fr=new FileReader();fr.onload=()=>onDone(fr.result);
      fr.readAsDataURL(new Blob(chunks,{type:r.mimeType||chunks[0].type}))};
    stopAll();btn.classList.add('recording');btn.innerHTML=btn.classList.contains('ib')?'⏹':lab(tx('⏹ थांबवा'));
    r.start();to=setTimeout(()=>{if(rec===r)r.stop()},maxMs||8000);
  }catch(e){toast(tx('माइक वापरण्याची परवानगी द्या'))}
}

/* mic level meter (for AUM) */
let mic=null;
async function micOn(){try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  const a=ac(),src=a.createMediaStreamSource(s),an=a.createAnalyser();an.fftSize=1024;src.connect(an);mic={s:s,an:an,buf:new Uint8Array(1024)};return true}catch(e){return false}}
function micLevel(){if(!mic)return 0;mic.an.getByteTimeDomainData(mic.buf);let sum=0;for(let i=0;i<mic.buf.length;i++){const x=(mic.buf[i]-128)/128;sum+=x*x}return Math.sqrt(sum/mic.buf.length)}
function micOff(){if(mic){try{mic.s.getTracks().forEach(t=>t.stop())}catch(e){}mic=null}}

  if(p)return `<div class="pic ${c.cat==='family'?'round':''} ${cls}"><img class="ph" src="${p}" alt=""></div>`;
  if(CIMG.includes(c.id))return `<div class="pic full ${cls}"><img class="ph" src="img/c/${c.id}.webp" alt=""></div>`;
  if(c.icon)return `<div class="pic ${cls}">${fx(c.icon)}</div>`;
  return `<div class="pic init ${cls}">${[...c.mr][0]}</div>`}

let filter='all',last=DATA.quick[0],talkT=null;

function renderGrid(){
  const list=cards().filter(c=>c.cat!=='word'&&c.speak&&(filter==='all'||c.cat===filter));
  $('grid').innerHTML=list.map(c=>`<div class="card ${c.cat}" id="card-${c.id}" data-id="${c.id}">${pic(c)}<div><div class="name">${c.mr}</div><div class="en">${c.sub||''}</div></div></div>`).join('');

$('grid').addEventListener('click',e=>{const el=e.target.closest('.card');if(el)talk(cards().find(c=>c.id===el.dataset.id))});
async function talk(item){
  if(!item)return;last=item;
  $('sayMr').textContent=item.mr;$('saySub').textContent=item.sub||'';
  document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
  const t=$('card-'+item.id);if(t)t.classList.add('speaking');
  $('dock').classList.add('talking');if(navigator.vibrate)navigator.vibrate(15);
  clearTimeout(talkT);const my=talkT=setTimeout(endTalk,7000);
  await say(item.id,item.speak);
  if(talkT===my)endTalk();
}
function endTalk(){clearTimeout(talkT);$('dock').classList.remove('talking');document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'))}
function sos(){
  [0,1,2,3,4,5].forEach(i=>setTimeout(()=>beep(i%2?660:880,.3,.5,'square'),i*220));
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
  if(view!=='talk'&&!$('stage').hidden)closeStage();
  go('talk');setTimeout(()=>talk(DATA.quick[2]),1400);
}

    if(b.dataset.r==='1')beep(880,.25,.2);nextSlide()}}
};

/* ================= MORE (progress, settings, studio) ================= */
function renderMore(){
  const td=today(),d=new Date(),cells=[];d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){const key=dkey(d),r=S.days[key],n=r?Object.keys(r.steps).length:0;cells.push(`<div class="${r&&r.full?'f':n?'p':''} ${key===td?'t':''}">${N(d.getDate())}</div>`);d.setDate(d.getDate()+1)}
  const wk=[],w=new Date();w.setDate(w.getDate()-6);
  for(let i=0;i<7;i++){const key=dkey(w),r=S.days[key];wk.push({m:Math.round(((r&&r.sec)||0)/60),l:short(DATA.days[w.getDay()]),t:key===td});w.setDate(w.getDate()+1)}
  const mx=Math.max(10,...wk.map(x=>x.m)),wsum=wk.reduce((a,x)=>a+x.m,0);
  const mins=Math.round(Object.values(S.days).reduce((a,r)=>a+(r.sec||0),0)/60);
  let aok=0,an=0;const d7=new Date();for(let i=0;i<7;i++){const r=S.days[dkey(d7)];if(r){aok+=r.ok||0;an+=r.n||0}d7.setDate(d7.getDate()-1)}
  const acc=an?N(Math.round(aok/an*100))+'%':'–';
  const P=namePool();let nw=0,nl=0,nm=0;P.forEach(c=>{const r=S.words[c.id];if(!r||!r.t)nw++;else if(r.s>=3)nm++;else nl++});const tot=P.length||1;
  const nVoice=Object.keys(DB.mem).filter(k=>k.startsWith('voice:')).length,nImg=Object.keys(DB.mem).filter(k=>k.startsWith('img:')).length;
  $('more').innerHTML=`
   <div class="hero"><div class="eyebrow">${tx('पातळी')} ${N(LV())} · ${LEVELS[LV()-1].mr}</div><div class="hello">${tx('तुमची प्रगती')}</div>
     <div class="stats">
       <div class="stat">${fx('🔥')}<b>${N(streak())}</b><small>${tx('सलग दिवस')}</small></div>
       <div class="stat">${fx('⏱️')}<b>${N(mins)}</b><small>${tx('मिनिटे सराव')}</small></div>
       <div class="stat">${fx('🎯')}<b>${acc}</b><small>${tx('बरोबर उत्तरे, ७ दिवस')}</small></div></div></div>
   <div class="pad">
   <div class="pcard"><div class="pcard-h"><b>${tx('या आठवड्यात')}</b><span>${N(wsum)} ${tx('मिनिटे')}</span></div>
     <div class="bars">${wk.map(x=>`<div class="${x.t?'td':''}"><i class="${x.m?'v':''}" style="height:calc((100% - 24px) * ${Math.max(.04,x.m/mx).toFixed(3)})">${x.m?`<em>${N(x.m)}</em>`:''}</i><small>${x.l}</small></div>`).join('')}</div></div>
   <div class="pcard"><div class="pcard-h"><b>${tx('मागील १४ दिवस')}</b></div><div class="cal">${cells.join('')}</div>
     <div class="legend"><span><i style="background:#22985A"></i>${tx('पूर्ण दिवस')}</span><span><i style="background:#F6A609"></i>${tx('थोडा सराव')}</span></div></div>
   <div class="pcard"><div class="pcard-h"><b>${tx('शब्दांची प्रगती')}</b><span>${N(P.length)}</span></div>
     <div class="mbar"><i style="width:${(nm/tot*100).toFixed(1)}%;background:#22985A"></i><i style="width:${(nl/tot*100).toFixed(1)}%;background:#F6A609"></i></div>
     <div class="mleg"><div><b>${N(nm)}</b><small><i style="background:#22985A"></i>${tx('पक्के')}</small></div><div><b>${N(nl)}</b><small><i style="background:#F6A609"></i>${tx('शिकत आहे')}</small></div><div><b>${N(nw)}</b><small><i style="background:#C9D3CD"></i>${tx('नवीन')}</small></div></div>
     ${S.bestAum?`<div class="note" style="background:var(--mor-t);color:var(--mor)">${fx('🎶')}<span>${tx('सर्वोत्तम आवाज: ')}<b>${N(S.bestAum)}</b>${tx(' सेकंद')}</span></div>`:''}</div>
   <div class="sec-h"><h2>${tx('आवाज आणि चित्रे')}</h2></div>
   <div class="list">
   <button class="item" data-a="setup"><span class="e">${fx('👤')}</span><span>${tx('नाव, भाषा आणि कुटुंब')}<small>${DATA.name}</small></span>${ic('chev','chev')}</button>
   <button class="item" data-a="voice"><span class="e">${fx('🎙️')}</span><span>${tx('घरच्यांचा आवाज रेकॉर्ड करा')}<small>${N(nVoice)} ${tx('रेकॉर्ड झाले. ओळखीचा आवाज सर्वात चांगला.')}</small></span>${ic('chev','chev')}</button>
   <button class="item" data-a="photo"><span class="e">${fx('📷')}</span><span>${tx('खरे फोटो आणि नवीन कार्ड')}<small>${N(nImg)} ${tx('फोटो लावले. स्वतःचा ग्लास, स्वतःचे घर, कुटुंब.')}</small></span>${ic('chev','chev')}</button>
   <button class="item" data-a="slow"><span class="e">${fx('🐢')}</span><span>${tx('हळू बोलणे')}<small>${tx('आवाज थोडा सावकाश ऐकू येईल')}</small></span><i class="sw ${S.slow?'on':''}"></i></button>
   </div>
   <div class="sec-h"><h2>${tx('घरच्यांसाठी')}</h2></div>
   <div class="pcard"><ul class="tips">
     <li>${tx('एका वेळी एकच छोटे वाक्य. हळू, नेहमीच्या आवाजात बोला.')}</li>
     <li>${tx('उत्तरासाठी १० सेकंद शांत थांबा. त्यांचे वाक्य तुम्ही पूर्ण करू नका.')}</li>
     <li>${tx('चुका सुधारत बसू नका. प्रयत्नाचे कौतुक करा.')}</li>
     <li>${tx('रोज १५ ते २० मिनिटे, शक्य असल्यास दिवसातून दोनदा. टीव्ही बंद ठेवा.')}</li>
     <li>${tx('जेवणानंतर सराव करा. घाम, थरथर, चक्कर वाटली तर थांबा व साखर तपासा.')}</li>
     <li>${tx('अचानक बोलणे बिघडले, चेहरा वाकडा झाला, हात-पाय लुळे पडले किंवा झटका आला तर ताबडतोब रुग्णालयात न्या.')}</li>
   </ul></div><div class="note">${fx('🩺')}<span>${tx('हे ॲप स्पीच थेरपिस्ट व डॉक्टरांच्या उपचाराला पूरक आहे, पर्याय नाही.')}</span></div></div>`;
}
$('more').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='slow'){S.slow=!S.slow;save();renderMore()}else if(b.dataset.a==='setup'){openSetup()}else openStudio(b.dataset.a)});

let mode='studio',libTab='w';
function openLib(){mode='lib';clean();run=null;openStage(tx('शब्द आणि वाक्ये'),tx('टॅप करा, ऐका, म्हणा'));
  $('stBarW').hidden=true;$('stC').textContent='';$('stNext').hidden=true;$('stBody').className='st-body left';renderLib()}
function renderLib(){const pool=namePool();
  $('stBody').innerHTML=`<div class="seg"><button data-lt="w" class="${libTab==='w'?'on':''}">${tx('शब्द (')}${N(pool.length)})</button><button data-lt="s" class="${libTab==='s'?'on':''}">${tx('वाक्ये (')}${N(DATA.scripts.length)})</button></div>`+
   (libTab==='w'?`<div class="pgrid">${pool.map(c=>`<button class="pcell ${c.cat}" data-w="${c.id}">${pic(c)}${c.w||c.mr}</button>`).join('')}</div>`
     :DATA.scripts.map(x=>`<button class="vrow lrow" data-sc="${x.id}"><span>${x.mr}<small>${x.sub}</small></span><i class="ib">▶</i></button>`).join(''))}
const GN={1:tx('बोला'),2:tx('शब्द'),3:tx('पहिला आवाज'),4:tx('हो की नाही'),5:tx('सराव'),6:tx('वाक्य पूर्ण करा'),7:tx('वाक्य बनवा'),8:tx('संवाद'),9:tx('उलट शब्द'),10:tx('अंक, वार, महिने')};
let studioTab='voice',target=null;
function openStudio(tab){mode='studio';studioTab=tab||studioTab;clean();run=null;openStage(tx('आवाज आणि चित्रे'),tx('घरच्यांनी एकदा सेट करा'));
  $('stBarW').hidden=true;$('stC').textContent='';$('stNext').hidden=true;$('stBody').className='st-body left';renderStudio()}
function renderStudio(){
  const seg=`<div class="seg"><button data-t="voice" class="${studioTab==='voice'?'on':''}">${lab(tx('🎙 आवाज'))}</button><button data-t="photo" class="${studioTab==='photo'?'on':''}">${tx('📷 फोटो / कार्ड')}</button></div>`;
  let h='';
  if(studioTab==='voice'){let g='';
    h=`<p class="muted">${tx('🎙 दाबा, वाक्य स्पष्ट बोला, पुन्हा दाबा. रेकॉर्ड केलेला आवाजच ॲपमध्ये वाजेल.')}</p>`+allAudio(DATA,peopleCards().concat(S.custom||[])).map(a=>{
      const has=!!DB.mem['voice:'+a.id];const head=a.g!==g?`<div class="h2">${GN[(g=a.g)]}</div>`:'';
      return head+`<div class="vrow"><span>${a.text}</span><button class="ib" data-p="${a.id}">▶</button><button class="ib ${has?'has':''}" data-r="${a.id}">🎙</button>${has?`<button class="ib" data-x="${a.id}">✕</button>`:''}</div>`}).join('');
  }else{
    h=`<div class="form"><b>${tx('नवीन कार्ड जोडा')}</b><input id="fN" placeholder="${tx('नाव (उदा. पेपर)')}" maxlength="18"><input id="fS" placeholder="${tx('वाक्य (उदा. मला पेपर द्या)')}" maxlength="60">
       <div style="display:flex;gap:8px"><select id="fC">${DATA.cats.slice(1).map(c=>`<option value="${c.id}">${c.e} ${c.l}</option>`).join('')}</select><input id="fE" placeholder="${tx('चिन्ह 📰')}" maxlength="4" style="width:110px"></div>
       <button class="btn primary" id="fAdd">${tx('कार्ड जोडा')}</button></div>
     <p class="muted" style="margin:12px 2px">${tx('कार्डावर टॅप करून खरा फोटो लावा. ओळखीच्या वस्तूंचे फोटो जास्त उपयोगी पडतात.')}</p>
     <div class="pgrid">${cards().map(c=>`<button class="pcell ${c.cat}" data-ph="${c.id}">${pic(c)}${c.mr}${String(c.id).startsWith('x')?`<span class="del" data-del="${c.id}">✕</span>`:DB.mem['img:'+c.id]?`<span class="del" data-rm="${c.id}">✕</span>`:''}</button>`).join('')}</div>`;
  }
  const b=$('stBody'),y=b.scrollTop;b.innerHTML=seg+h;b.scrollTop=y;
}
$('stBody').addEventListener('click',e=>{
  if(run)return;const q=s=>e.target.closest(s);let b;
  if(mode==='lib'){
    if(b=q('[data-lt]')){libTab=b.dataset.lt;$('stBody').scrollTop=0;return renderLib()}
    if(b=q('[data-w]')){const c=cards().find(k=>k.id===b.dataset.w);return say('w_'+c.id,c.w||c.mr)}
    if(b=q('[data-sc]')){const x=DATA.scripts.find(k=>k.id===b.dataset.sc);return say(x.id,x.speak)}
    return}
  if(b=q('[data-t]')){studioTab=b.dataset.t;$('stBody').scrollTop=0;return renderStudio()}
  if(b=q('[data-p]')){const a=allAudio(DATA,peopleCards().concat(S.custom||[])).find(x=>x.id===b.dataset.p);return say(a.id,a.text)}
  if(b=q('[data-r]')){const id=b.dataset.r;return recToggle(b,url=>{DB.set('voice:'+id,url);delete noClip[id];renderStudio();playSrc(url,1)},9000)}
  if(b=q('[data-x]')){DB.del('voice:'+b.dataset.x);return renderStudio()}
  if(b=q('[data-del]')){const id=b.dataset.del;S.custom=S.custom.filter(c=>c.id!==id);DB.del('img:'+id);DB.del('voice:'+id);save();return renderStudio()}
  if(b=q('[data-rm]')){DB.del('img:'+b.dataset.rm);return renderStudio()}
  if(b=q('[data-ph]')){const id=b.dataset.ph;return choosePhoto(url=>{DB.set('img:'+id,url);if(!$('stage').hidden&&!run)renderStudio()})}
  if(q('#fAdd')){const n=tidy($('fN').value),s=tidy($('fS').value);if(!n){toast(tx('नाव लिहा'));return}
    S.custom.push({id:'x'+Date.now(),cat:$('fC').value,mr:n,sub:'',speak:s||n,icon:tidy($('fE').value)||'💬'});save();toast(tx('कार्ड जोडले ✓'));renderStudio()}
});
/* photos: the family chooses camera or gallery; the picture is cut to a square and kept on the phone */
let photoCb=null;
function choosePhoto(cb){photoCb=cb;closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sheet';
  d.innerHTML=`<div class="sheet-in"><h4>${tx('फोटो लावा')}</h4><div class="two"><button data-src="pickCam">${fx('📷')}${tx('कॅमेरा')}</button><button data-src="pick">${fx('🖼️')}${tx('गॅलरी')}</button></div>
    <button class="btn big cancel" data-src="">${tx('रद्द करा')}</button></div>`;
  d.onclick=e=>{const b=e.target.closest('[data-src]');if(!b&&e.target!==d)return;closeSheet();if(b&&b.dataset.src){const f=$(b.dataset.src);f.value='';f.click()}};
  document.body.appendChild(d)}
function closeSheet(){const s=$('sheet');if(s){s.remove();return true}return false}
['pick','pickCam'].forEach(k=>$(k).addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0],cb=photoCb;if(!file||!cb)return;
  const r=new FileReader();
  r.onload=e=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=480;const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,480,480);cb(c.toDataURL('image/jpeg',.85))};im.src=e.target.result};
  r.readAsDataURL(file)}));

/* ================= boot ================= */
/* ================= first-run setup: language, name, voice, family ================= */
let pend={name:'',rel:'',photo:''};
const avatar=p=>{const ph=DB.mem['img:'+p.id];return ph?`<img src="${ph}" alt="">`:`<span class="ini">${[...p.name][0]||''}</span>`};
const camB=`<span class="cam">${'<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'}</span>`;
function openSetup(){
  let el=$('setup');if(!el){el=document.createElement('div');el.id='setup';el.className='setup';document.body.appendChild(el)}
  const y=el.scrollTop;
  el.innerHTML=`${S.setup?`<button class="su-close" id="suX" aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`:''}<div class="su-in">
    <div class="su-brand">${APP}</div><div class="su-tag">${tx('पक्षाघातानंतर पुन्हा बोलण्यासाठी रोजची साथ')}</div>
    <h3>${tx('Language / भाषा')}</h3><div class="su-row">${Object.keys(PACKS).map(l=>`<button class="btn ${l===S.lang?'primary':''}" data-l="${l}">${PACKS[l].name}</button>`).join('')}</div>
    <h3>${tx('ॲप कोण वापरणार?')}</h3><input id="suMe" placeholder="${tx('त्यांचे नाव')}" maxlength="24" value="${S.me||''}">
    <h3>${tx('ॲपचा आवाज')}</h3><div class="su-row"><button class="btn ${S.voice!=='f'?'primary':''}" data-g="m">${tx('पुरुष')}</button><button class="btn ${S.voice==='f'?'primary':''}" data-g="f">${tx('स्त्री')}</button></div>
    <h3>${tx('कुटुंब आणि मदतनीस')}</h3><p class="muted">${tx('फोटो लावल्यास वाचता न आले तरी ओळखता येईल.')}</p>
    <div class="fam">${(S.people||[]).map(p=>`<div class="fp"><button class="fav" data-pp="${p.id}">${avatar(p)}${camB}</button><div><b>${p.name}</b><small>${relName(p.rel)}</small></div><button class="ib" data-rp="${p.id}">✕</button></div>`).join('')}</div>
    <div class="fadd"><button class="fav big" id="suPh">${pend.photo?`<img src="${pend.photo}" alt="">${camB}`:`<span class="lbl">${'<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'}${tx('फोटो')}</span>`}</button>
      <div class="ff"><input id="suN" placeholder="${tx('नाव')}" maxlength="20" value="${pend.name}"><select id="suR">${DATA.rel.map(r=>`<option value="${r.id}" ${r.id===pend.rel?'selected':''}>${r.l}</option>`).join('')}</select></div></div>
    <button class="btn" id="suAdd" style="width:100%;margin-top:10px">${tx('आणखी एक जोडा')}</button>
    <p class="muted" style="margin-top:22px">${tx('हे ॲप स्पीच थेरपिस्ट व डॉक्टरांच्या उपचाराला पूरक आहे, पर्याय नाही.')}</p>
    <button class="btn primary big" id="suGo">${S.setup?tx('पूर्ण झाले'):tx('सुरू करा')}</button></div>`;
  el.hidden=false;el.scrollTop=y;
}
function closeSetup(){const el=$('setup');if(el)el.hidden=true;renderGrid();if(view==='more')renderMore()}
document.addEventListener('click',e=>{const el=$('setup');if(!el||el.hidden||!el.contains(e.target))return;const q=x=>e.target.closest(x);let b;
  const keep=()=>{S.me=tidy($('suMe').value);pend.name=$('suN').value;pend.rel=$('suR').value;save()};
  const addP=()=>{const n=tidy($('suN').value);if(n){const id='p'+Date.now();S.people.push({id:id,name:n,rel:$('suR').value});if(pend.photo)DB.set('img:'+id,pend.photo);pend={name:'',rel:'',photo:''};save()}return n};
  if(b=q('[data-l]')){keep();addP();S.lang=b.dataset.l;save();return location.reload()}
  if(b=q('[data-g]')){keep();addP();S.voice=b.dataset.g;save();return openSetup()}
  if(b=q('[data-rp]')){keep();DB.del('img:'+b.dataset.rp);S.people=S.people.filter(p=>p.id!==b.dataset.rp);save();return openSetup()}
  if(b=q('[data-pp]')){keep();const id=b.dataset.pp;return choosePhoto(url=>{DB.set('img:'+id,url);openSetup()})}
  if(q('#suPh')){keep();return choosePhoto(url=>{pend.photo=url;openSetup()})}
  if(q('#suAdd')){keep();if(!addP())toast(tx('नाव लिहा'));return openSetup()}
  if(q('#suX')){keep();addP();return closeSetup()}
  if(q('#suGo')){keep();addP();const first=!S.setup;S.setup=1;save();if(first)setTimeout(()=>location.reload(),300);else closeSetup()}
});

/* ================= phone back button ================= */
function goBack(){
  if(closeSheet())return;
  const su=$('setup');if(su&&!su.hidden){if(S.setup)closeSetup();return}
  if(!$('stage').hidden){closeStage();return}
  if(view!=='talk'){go('talk');return}
  const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  try{A.minimizeApp?A.minimizeApp():A.exitApp()}catch(e){}
}
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A&&A.addListener)A.addListener('backButton',goBack)}catch(e){}

/* ================= boot ================= */
$('appName').textContent=APP;
document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=tx(e.dataset.t)});
if(S.lang!=='en')$('saySub').textContent='What do you need?';
renderTabs();renderGrid();go('talk');window.__booted=true;
DB.open().then(()=>{renderGrid();const su=$('setup');if(su&&!su.hidden)openSetup()});
if(!S.setup)openSetup();
</script>
